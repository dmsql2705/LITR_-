<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiTR 관리자 대시보드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* 로그인 화면 */
        .login-overlay {
            position: fixed; inset: 0;
            background: #0f1117;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }
        .login-box h2 { margin-bottom: 8px; color: #8b5cf6; }
        .login-box p { margin-bottom: 24px; color: #888; font-size: 14px; }
        .login-box input {
            width: 100%; padding: 12px 16px;
            background: #0f1117; border: 1px solid #2a2d3a;
            border-radius: 8px; color: #e0e0e0;
            margin-bottom: 12px; font-size: 14px;
        }
        .login-box input:focus { outline: none; border-color: #8b5cf6; }
        .login-box button {
            width: 100%; padding: 12px;
            background: #8b5cf6; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; cursor: pointer;
            margin-top: 8px;
        }
        .login-box button:hover { background: #7c3aed; }
        .login-error { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }

        /* 대시보드 */
        .dashboard { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
        .dashboard.active { display: block; }

        .dash-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .dash-header h1 { font-size: 22px; color: #8b5cf6; }
        .dash-header .logout-btn {
            padding: 8px 16px; background: #2a2d3a;
            border: 1px solid #3a3d4a; border-radius: 8px;
            color: #ccc; cursor: pointer; font-size: 13px;
        }
        .dash-header .logout-btn:hover { background: #3a3d4a; }

        /* 통계 카드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 32px;
        }
        .stat-card {
            background: #1a1d27; border: 1px solid #2a2d3a;
            border-radius: 12px; padding: 20px;
        }
        .stat-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #fff; }
        .stat-card .sub { font-size: 12px; color: #666; margin-top: 4px; }

        /* 섹션 */
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 18px; margin-bottom: 16px; color: #ccc; }

        /* 테이블 */
        .table-wrap {
            background: #1a1d27; border: 1px solid #2a2d3a;
            border-radius: 12px; overflow: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left; padding: 12px 16px;
            background: #12141c; color: #888;
            font-weight: 600; white-space: nowrap;
        }
        td { padding: 10px 16px; border-top: 1px solid #1e2130; white-space: nowrap; }
        tr:hover td { background: #1e2130; }

        /* 차트 */
        .chart-container {
            background: #1a1d27; border: 1px solid #2a2d3a;
            border-radius: 12px; padding: 20px;
        }
        .chart-legend {
            display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px;
        }
        .chart-legend span::before {
            content: ''; display: inline-block;
            width: 12px; height: 12px; border-radius: 3px;
            margin-right: 6px; vertical-align: middle;
        }
        .chart-legend .dau::before { background: #8b5cf6; }
        .chart-legend .stay::before { background: #06b6d4; }
        .chart-legend .sessions::before { background: #f59e0b; }
        canvas { width: 100% !important; height: 300px; }

        /* 로딩 */
        .loading { text-align: center; padding: 40px; color: #666; }

        /* 반응형 */
        @media (max-width: 768px) {
            .dashboard { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            canvas { height: 200px; }
        }
    </style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>LiTR Admin</h2>
        <p>관리자 계정으로 로그인하세요</p>
        <input type="text" id="loginUsername" placeholder="사용자명" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
        <button onclick="adminLogin()">로그인</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- 대시보드 -->
<div class="dashboard" id="dashboard">
    <div class="dash-header">
        <h1>LiTR 관리자 대시보드</h1>
        <button class="logout-btn" onclick="adminLogout()">로그아웃</button>
    </div>

    <!-- 통계 카드 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="label">총 유저</div>
            <div class="value" id="statTotalUsers">-</div>
        </div>
        <div class="stat-card">
            <div class="label">오늘 활성 유저 (DAU)</div>
            <div class="value" id="statDAU">-</div>
        </div>
        <div class="stat-card">
            <div class="label">현재 접속자</div>
            <div class="value" id="statOnline">-</div>
            <div class="sub">최근 2분 내 활동 기준</div>
        </div>
        <div class="stat-card">
            <div class="label">총 게임 세션</div>
            <div class="value" id="statSessions">-</div>
        </div>
        <div class="stat-card">
            <div class="label">총 플레이시간</div>
            <div class="value" id="statPlaytime">-</div>
        </div>
    </div>

    <!-- 유저 테이블 -->
    <div class="section">
        <h2>유저별 활동</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>사용자명</th>
                        <th>닉네임</th>
                        <th>총 체류시간</th>
                        <th>총 플레이시간</th>
                        <th>마지막 활동</th>
                        <th>가입일</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="7" class="loading">로딩 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 일별 차트 -->
    <div class="section">
        <h2>일별 활동 (최근 30일)</h2>
        <div class="chart-container">
            <div class="chart-legend">
                <span class="dau">DAU (활성유저)</span>
                <span class="stay">평균 체류시간 (분)</span>
                <span class="sessions">게임 세션</span>
            </div>
            <canvas id="dailyChart"></canvas>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin + '/api';
    let adminToken = null;

    // ============================================
    // 로그인
    // ============================================
    async function adminLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.style.display = 'none';

        if (!username || !password) {
            errorEl.textContent = '사용자명과 비밀번호를 입력하세요.';
            errorEl.style.display = 'block';
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.detail || '로그인 실패');
            }

            const data = await res.json();
            adminToken = data.access_token;

            // 관리자 권한 확인 (stats API 호출로 검증)
            const statsRes = await fetch(`${API_BASE}/admin/stats`, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });

            if (statsRes.status === 403) {
                throw new Error('관리자 권한이 없는 계정입니다.');
            }
            if (!statsRes.ok) {
                throw new Error('권한 확인 실패');
            }

            // 로그인 성공
            sessionStorage.setItem('admin_token', adminToken);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            loadDashboard();
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
        }
    }

    // 엔터키 로그인
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') adminLogin();
    });
    document.getElementById('loginUsername').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('loginPassword').focus();
    });

    function adminLogout() {
        sessionStorage.removeItem('admin_token');
        adminToken = null;
        location.reload();
    }

    // ============================================
    // 자동 로그인 (세션 복원)
    // ============================================
    (async function checkSession() {
        const saved = sessionStorage.getItem('admin_token');
        if (!saved) return;

        try {
            const res = await fetch(`${API_BASE}/admin/stats`, {
                headers: { 'Authorization': `Bearer ${saved}` }
            });
            if (res.ok) {
                adminToken = saved;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                loadDashboard();
            }
        } catch (e) { /* 무시 */ }
    })();

    // ============================================
    // 대시보드 로드
    // ============================================
    async function loadDashboard() {
        await Promise.all([loadStats(), loadUserActivity(), loadDailyChart()]);
    }

    function authHeaders() {
        return { 'Authorization': `Bearer ${adminToken}` };
    }

    // ============================================
    // 통계 카드
    // ============================================
    async function loadStats() {
        try {
            const res = await fetch(`${API_BASE}/admin/stats`, { headers: authHeaders() });
            const data = await res.json();

            document.getElementById('statTotalUsers').textContent = data.total_users.toLocaleString();
            document.getElementById('statDAU').textContent = data.dau.toLocaleString();
            document.getElementById('statOnline').textContent = data.online_users.toLocaleString();
            document.getElementById('statSessions').textContent = data.total_sessions.toLocaleString();
            document.getElementById('statPlaytime').textContent = formatDuration(data.total_play_seconds);
        } catch (e) {
            console.error('통계 로드 실패:', e);
        }
    }

    // ============================================
    // 유저 테이블
    // ============================================
    async function loadUserActivity() {
        try {
            const res = await fetch(`${API_BASE}/admin/users/activity`, { headers: authHeaders() });
            const users = await res.json();
            const tbody = document.getElementById('userTableBody');

            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#666;">데이터 없음</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.user_id}</td>
                    <td>${escapeHtml(u.username)}</td>
                    <td>${escapeHtml(u.nickname)}</td>
                    <td>${formatDuration(u.site_seconds)}</td>
                    <td>${formatDuration(u.play_seconds)}</td>
                    <td>${u.last_activity ? formatDate(u.last_activity) : '-'}</td>
                    <td>${u.created_at ? formatDate(u.created_at) : '-'}</td>
                </tr>
            `).join('');
        } catch (e) {
            console.error('유저 활동 로드 실패:', e);
        }
    }

    // ============================================
    // 일별 차트 (Canvas)
    // ============================================
    async function loadDailyChart() {
        try {
            const res = await fetch(`${API_BASE}/admin/activity/daily?days=30`, { headers: authHeaders() });
            const data = await res.json();
            drawChart(data);
        } catch (e) {
            console.error('일별 차트 로드 실패:', e);
        }
    }

    function drawChart(data) {
        const canvas = document.getElementById('dailyChart');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        // 캔버스 크기 설정
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = (rect.width - 40) * dpr;
        canvas.height = 300 * dpr;
        canvas.style.width = (rect.width - 40) + 'px';
        canvas.style.height = '300px';
        ctx.scale(dpr, dpr);

        const W = rect.width - 40;
        const H = 300;
        const padding = { top: 20, right: 20, bottom: 50, left: 50 };
        const chartW = W - padding.left - padding.right;
        const chartH = H - padding.top - padding.bottom;

        if (!data.length) return;

        // 최대값 계산
        const maxDAU = Math.max(...data.map(d => d.dau), 1);
        const maxStay = Math.max(...data.map(d => d.avg_stay_minutes), 1);
        const maxSessions = Math.max(...data.map(d => d.sessions), 1);
        const maxVal = Math.max(maxDAU, maxStay, maxSessions, 1);

        // 배경
        ctx.fillStyle = '#1a1d27';
        ctx.fillRect(0, 0, W, H);

        // 그리드 라인
        ctx.strokeStyle = '#2a2d3a';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            const y = padding.top + (chartH / 4) * i;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(W - padding.right, y);
            ctx.stroke();

            // Y축 라벨
            const val = Math.round(maxVal - (maxVal / 4) * i);
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(val, padding.left - 8, y + 4);
        }

        // X축 날짜 라벨 (5일 간격)
        ctx.fillStyle = '#666';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        const barW = chartW / data.length;
        data.forEach((d, i) => {
            if (i % 5 === 0 || i === data.length - 1) {
                const x = padding.left + barW * i + barW / 2;
                ctx.fillText(d.date.slice(5), x, H - padding.bottom + 18);
            }
        });

        // 데이터 라인 그리기
        function drawLine(values, color) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            values.forEach((val, i) => {
                const x = padding.left + barW * i + barW / 2;
                const y = padding.top + chartH - (val / maxVal) * chartH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // 포인트
            values.forEach((val, i) => {
                const x = padding.left + barW * i + barW / 2;
                const y = padding.top + chartH - (val / maxVal) * chartH;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            });
        }

        drawLine(data.map(d => d.dau), '#8b5cf6');
        drawLine(data.map(d => d.avg_stay_minutes), '#06b6d4');
        drawLine(data.map(d => d.sessions), '#f59e0b');
    }

    // 윈도우 리사이즈 시 차트 다시 그리기
    let resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (adminToken) loadDailyChart(); }, 200);
    });

    // ============================================
    // 유틸리티
    // ============================================
    function formatDuration(seconds) {
        if (!seconds || seconds <= 0) return '0분';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (h > 0) return `${h}시간 ${m}분`;
        return `${m}분`;
    }

    function formatDate(isoStr) {
        if (!isoStr) return '-';
        const d = new Date(isoStr);
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const mins = d.getMinutes().toString().padStart(2, '0');
        return `${month}/${day} ${hours}:${mins}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
